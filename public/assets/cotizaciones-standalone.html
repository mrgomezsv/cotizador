<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cotizaciones - Mi Factura DTE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <style>
        :root {
            /* PALETA BASADA EN LA UI DE MI FACTURA DTE */
            --brand-primary: #2563EB;
            /* Azul vibrante del logo y estados activos */
            --brand-secondary: #64748B;
            /* Gris pizarra para textos secundarios (reemplaza al dorado) */
            --brand-accent: #EFF6FF;
            /* Azul súper suave para fondos secundarios */
            --text-main: #0F172A;
            /* Casi negro para lectura óptima */
            --text-dim: #64748B;
            /* Gris para descripciones */
            --bg-paper: #FFFFFF;
            /* Blanco puro de las tarjetas */
            --border-soft: #E2E8F0;
            /* Gris muy sutil para las divisiones */
            --table-header: #F8FAFC;
            /* Fondo de la tabla del dashboard */
            --table-row-even: #F8FAFC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #F1F5F9;
            padding: 40px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .cotizaciones-container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--bg-paper);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-soft);
        }

        h1 {
            text-align: left;
            color: var(--brand-primary);
            margin-bottom: 30px;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cotizacion-form fieldset {
            border: 1px solid var(--border-soft);
            margin-bottom: 24px;
            padding: 24px;
            border-radius: 16px;
            background: #FBFCFD;
        }

        .cotizacion-form legend {
            font-weight: 700;
            color: var(--brand-primary);
            font-size: 14px;
            padding: 0 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cotizacion-form label {
            display: block;
            margin-bottom: 16px;
            font-weight: 500;
            color: var(--text-dim);
            font-size: 13px;
        }

        .cotizacion-form input[type="text"],
        .cotizacion-form input[type="date"],
        .cotizacion-form input[type="number"],
        .cotizacion-form textarea {
            width: 100%;
            padding: 12px 16px;
            margin-top: 6px;
            border-radius: 12px;
            border: 1.5px solid var(--border-soft);
            background: white;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .cotizacion-form input:focus,
        .cotizacion-form textarea:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .items-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 16px;
        }

        .items-table th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-dim);
            border-bottom: 2px solid var(--border-soft);
        }

        .items-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border-soft);
            font-size: 14px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin: 32px 0;
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-item {
            background: var(--brand-accent);
            color: var(--brand-primary);
        }

        .clear-form {
            background: #F1F5F9;
            color: var(--text-dim);
        }

        .download-cotizacion {
            background: var(--brand-primary);
            color: white;
            margin-left: auto;
        }

        /* PREVIEW AREA */
        .preview-container {
            margin-top: 40px;
            background: #F8FAFC;
            padding: 20px 0;
            border-radius: 24px;
            border: 1px solid var(--border-soft);
            display: block;
            overflow-x: auto;
        }

        .pdf-container {
            width: 794px;
            /* A4 width */
            min-height: 1123px;
            /* A4 height exacto de 1 página */
            background: white;
            padding: 35px 45px 10px 45px;
            margin: 0 auto;
            position: relative;
            box-shadow: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            text-align: left;
            overflow: hidden;
        }

        /* PREMIUM PDF CONTENT STYLES */
        .pdf-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            position: relative;
        }

        .pdf-header::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 1px;
            /* Línea divisoria en azul UI */
            background: linear-gradient(to right, var(--brand-primary), transparent);
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--brand-primary);
            letter-spacing: -0.02em;
        }

        .brand-slogan {
            font-size: 12px;
            font-weight: 500;
            color: var(--brand-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .brand-contact {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 2px;
            display: flex;
            gap: 12px;
        }

        .doc-type {
            background: var(--brand-primary);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: inline-block;
        }

        .meta-section {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .meta-item {
            font-size: 12px;
            color: var(--text-dim);
        }

        .meta-item strong {
            color: var(--text-main);
            font-weight: 700;
        }

        .client-section {
            background: var(--brand-accent);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            border: 1px solid var(--border-soft);
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--brand-primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .client-info div,
        .payment-info div {
            margin-top: 4px;
            font-size: 13px;
            line-height: 1.5;
        }

        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .pdf-table th {
            /* Tabla más limpia como en la UI */
            background: var(--table-header);
            color: var(--brand-secondary);
            text-align: left;
            padding: 10px 16px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border-soft);
        }

        .pdf-table th:first-child {
            border-radius: 12px 0 0 0;
        }

        .pdf-table th:last-child {
            border-radius: 0 12px 0 0;
            text-align: right;
        }

        .pdf-table td {
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-soft);
            font-size: 12.5px;
            vertical-align: top;
            line-height: 1.35;
        }

        .pdf-table td:last-child {
            text-align: right;
            font-weight: 600;
        }

        .pdf-table tr:last-child td {
            border-bottom: none;
        }

        .comments-box {
            background: var(--brand-accent);
            border: 1px solid var(--border-soft);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .totals-summary-area {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .totals-box {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            color: var(--text-dim);
        }

        .total-row.grand-total {
            margin-top: 4px;
            padding-top: 10px;
            border-top: 2px solid var(--brand-primary);
            color: var(--brand-primary);
            font-size: 19px;
            font-weight: 800;
        }

        .signature-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: auto;
            padding-top: 10px;
            margin-bottom: 10px;
        }

        .signature-box {
            text-align: center;
        }

        .signature-line {
            border-top: 1.5px solid var(--border-soft);
            margin-bottom: 10px;
        }

        .signature-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
        }

        .signature-title {
            font-size: 10px;
            color: var(--brand-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            width: 500px;
            height: 500px;
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
        }

        @media print {
            @page {
                size: letter portrait;
                margin: 0;
            }

            html, body {
                height: 100%;
                overflow: hidden;
            }

            body {
                background: white;
                padding: 0 !important;
                margin: 0 !important;
            }

            .actions,
            h1,
            h2,
            .cotizacion-form,
            #validationMessage {
                display: none !important;
            }

            .cotizaciones-container {
                max-width: 100%;
                margin: 0;
                padding: 0;
                border: none;
                box-shadow: none;
                background: transparent;
            }

            .preview-container {
                padding: 0;
                background: none;
                border: none;
                margin: 0;
            }

            .pdf-container {
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                box-sizing: border-box !important;
                padding: 20px 35px 45px 35px !important;
                margin: 0 !important;
                box-shadow: none;
                border: none;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .signature-section {
                margin-top: auto !important;
                padding-bottom: 0 !important;
                margin-bottom: 0 !important;
            }
        }
    </style>
</head>

<body>
    <div class="cotizaciones-container">
        <h1>🧾 Generador de Cotizaciones</h1>

        <form class="cotizacion-form" id="cotizacionForm">
            <fieldset>
                <legend>📋 Datos Generales del Cliente</legend>
                <label>👤 Cliente:
                    <input type="text" id="cliente" placeholder="Nombre del cliente">
                </label>
                <label>📍 Dirección:
                    <input type="text" id="direccion" placeholder="Dirección del cliente">
                </label>
                <label>📞 Teléfono:
                    <input type="text" id="telefono" placeholder="Teléfono del cliente">
                </label>
                <label>📅 Fecha:
                    <input type="date" id="fecha">
                </label>
                <input type="hidden" id="folio">
            </fieldset>

            <fieldset>
                <legend>🛒 Productos / Servicios</legend>
                <table class="items-table" id="itemsTable">
                    <thead>
                        <tr>
                            <th>📝 Descripción</th>
                            <th>🔢 Cantidad</th>
                            <th>💰 Precio Unitario</th>
                            <th>💵 Total</th>
                            <th>🗑️</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                    </tbody>
                </table>
                <button type="button" class="add-item" onclick="addItemRow()">
                    ➕ Agregar Producto/Servicio
                </button>
            </fieldset>

            <fieldset>
                <legend>💳 Datos Sobre las Condiciones de Pago</legend>
                <label>📄 Emitir cheque a nombre de:
                    <input type="text" id="cheque" placeholder="Nombre completo para el cheque">
                </label>
                <label>🆔 NIT:
                    <input type="text" id="nit" placeholder="Número de identificación tributaria">
                </label>
                <label>💵 Forma de Pago:
                    <input type="text" id="pago" placeholder="Descripción de la forma de pago">
                </label>
                <label>✍️ Firma Empresa:
                    <input type="text" id="firmaEmpresa" placeholder="Nombre de la persona que firma"
                        value="Tec. Ing. Mario Roberto Gómez Martínez">
                </label>
                <label class="toggle-label">
                    <span>💰 Calcular IVA (13%):</span>
                    <div class="toggle-switch">
                        <input type="checkbox" id="calcularIva" checked>
                        <span class="toggle-slider"></span>
                    </div>
                </label>
                <label>📝 Comentarios sobre la cotización:
                    <textarea id="comentarios" rows="4"
                        placeholder="Describe brevemente lo que incluye la cotización"></textarea>
                </label>
            </fieldset>
        </form>

        <div class="actions">
            <button class="clear-form" onclick="clearForm()" type="button">
                🗑️ Limpiar Formulario
            </button>
            <button class="download-cotizacion" onclick="downloadCotizacion()" type="button" id="downloadButton"
                disabled>
                📄 Descargar Cotización
            </button>
        </div>

        <div id="validationMessage"
            style="display: none; margin: 10px 0; padding: 10px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 4px;">
            <strong>⚠️ Campos requeridos faltantes:</strong>
            <ul id="validationList" style="margin: 5px 0 0 20px;"></ul>
        </div>

        <h2>👁️ Previsualización</h2>
        <div class="preview-container">
            <div id="cotizacion-preview" class="pdf-container">
            </div>
        </div>
    </div>

    <script src="/assets/html2pdf.bundle.min.js"></script>
    <script>
        let items = [];

        document.addEventListener('DOMContentLoaded', function () {
            const hash = window.location.hash;
            if (hash.startsWith('#data=')) {
                try {
                    const encodedData = hash.substring(6);
                    const cotizacionData = JSON.parse(decodeURIComponent(encodedData));
                    cargarCotizacionDesdeDatos(cotizacionData);

                    setTimeout(() => {
                        window.scrollTo(0, 0);
                        try {
                            if (typeof html2pdf !== 'undefined') {
                                downloadPDFAlternative();
                            } else {
                                window.print();
                            }
                        } catch(err) {
                            console.error("Fallo al descargar PDF automático:", err);
                            window.print();
                        }
                    }, 800);
                    return;
                } catch (e) {
                    console.error('Error parseando datos del hash:', e);
                }
            }

            const cotizacionParaPDF = localStorage.getItem('cotizacionParaPDF');
            const generarPDFAutomaticamente = localStorage.getItem('generarPDFAutomaticamente');

            if (cotizacionParaPDF && generarPDFAutomaticamente === 'true') {
                try {
                    const cotizacionData = JSON.parse(cotizacionParaPDF);
                    cargarCotizacionDesdeDatos(cotizacionData);
                    localStorage.removeItem('cotizacionParaPDF');
                    localStorage.removeItem('generarPDFAutomaticamente');

                    setTimeout(() => {
                        downloadPDFAlternative();
                    }, 1000);
                    return;
                } catch (error) {
                    console.error('Error cargando datos de cotización:', error);
                }
            }

            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('fecha').value = `${year}-${month}-${day}`;

            addItemRow();
            addEventListeners();
            setTimeout(updatePreview, 100);
            setTimeout(validateForm, 200);
        });

        function cargarCotizacionDesdeDatos(cotizacionData) {
            if (document.getElementById('cliente')) document.getElementById('cliente').value = cotizacionData.cliente || 'Cliente';
            if (document.getElementById('direccion')) document.getElementById('direccion').value = cotizacionData.direccion || 'N/A';
            if (document.getElementById('telefono')) document.getElementById('telefono').value = cotizacionData.telefono || 'N/A';
            if (document.getElementById('fecha')) document.getElementById('fecha').value = cotizacionData.fecha || '';
            if (document.getElementById('cheque')) document.getElementById('cheque').value = cotizacionData.cheque || 'Mario Roberto Gomez Martinez';
            if (document.getElementById('nit')) document.getElementById('nit').value = cotizacionData.nit || 'N/A';
            if (document.getElementById('pago')) document.getElementById('pago').value = cotizacionData.pago || 'Contado';
            if (document.getElementById('firmaEmpresa')) document.getElementById('firmaEmpresa').value = cotizacionData.firmaEmpresa || 'Tec. Ing. Mario Roberto Gómez Martínez';
            if (document.getElementById('calcularIva')) document.getElementById('calcularIva').checked = cotizacionData.calcularIva !== undefined ? cotizacionData.calcularIva : true;
            if (document.getElementById('comentarios')) document.getElementById('comentarios').value = cotizacionData.comentarios || '';
            if (document.getElementById('folio')) document.getElementById('folio').value = cotizacionData.folio || '';

            items = (cotizacionData.items || []).map(item => ({
                desc: item.desc || item.descripcion || 'Item',
                qty: Number(item.qty || item.cantidad || 1),
                unit: Number(item.unit || item.precioUnitario || 0),
                total: Number(item.total || 0)
            }));

            if (items.length === 0) {
                addItemRow();
            }

            renderItemsTable();
            updatePreview();
            validateForm();
        }

        function addEventListeners() {
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('input', function () {
                    updatePreview();
                    validateForm();
                });
                input.addEventListener('change', function () {
                    updatePreview();
                    validateForm();
                });
                input.addEventListener('keyup', function () {
                    updatePreview();
                    validateForm();
                });
            });

            document.getElementById('telefono').addEventListener('input', function (e) {
                formatPhoneNumber(e.target);
                validateForm();
            });

            document.getElementById('calcularIva').addEventListener('change', function () {
                updatePreview();
            });
        }

        function validateForm() {
            const requiredFields = {
                'cliente': 'Cliente',
                'direccion': 'Dirección',
                'telefono': 'Teléfono',
                'fecha': 'Fecha',
                'cheque': 'Emitir cheque a nombre de',
                'nit': 'NIT',
                'pago': 'Forma de Pago'
            };

            const missingFields = [];
            const downloadButton = document.getElementById('downloadButton');
            const validationMessage = document.getElementById('validationMessage');
            const validationList = document.getElementById('validationList');

            for (const [fieldId, fieldName] of Object.entries(requiredFields)) {
                const field = document.getElementById(fieldId);
                if (!field || !field.value.trim()) {
                    missingFields.push(fieldName);
                }
            }

            const validItems = getValidItems();
            if (validItems.length === 0) {
                missingFields.push('Al menos un producto/servicio');
            }

            if (missingFields.length === 0) {
                downloadButton.disabled = false;
                validationMessage.style.display = 'none';
            } else {
                downloadButton.disabled = true;
                validationMessage.style.display = 'block';
                validationList.innerHTML = missingFields.map(field => `<li>${field}</li>`).join('');
            }
        }

        function formatCurrency(value) {
            return "$" + Number(value).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatNumberInput(input) {
            let value = input.value.replace(/[^0-9.]/g, '');
            let parts = value.split('.');

            if (parts[0]) {
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }

            if (parts[1] && parts[1].length > 2) {
                parts[1] = parts[1].substring(0, 2);
            }

            input.value = parts.join('.');
        }

        function formatPhoneNumber(input) {
            let value = input.value.replace(/\D/g, '');

            if (value.length === 8) {
                input.value = `${value.substring(0, 4)}-${value.substring(4)}`;
            } else if (value.length === 11) {
                input.value = `(${value.substring(0, 3)}) ${value.substring(3, 7)}-${value.substring(7)}`;
            } else if (value.length >= 12) {
                const countryCode = value.substring(0, value.length - 8);
                const remaining = value.substring(value.length - 8);
                input.value = `+${countryCode} ${remaining.substring(0, 4)}-${remaining.substring(4)}`;
            } else {
                input.value = value;
            }
        }

        function addItemRow() {
            const item = {
                desc: '',
                qty: 1,
                unit: 0,
                total: 0
            };
            items.push(item);
            renderItemsTable();
            updatePreview();
            validateForm();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItemsTable();
            updatePreview();
            validateForm();
        }

        function renderItemsTable() {
            const tbody = document.getElementById('itemsBody');
            tbody.innerHTML = '';

            items.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <textarea rows="2" placeholder="Descripción del producto o servicio..." 
                                 oninput="updateItem(${index}, 'desc', this.value); updatePreview(); validateForm();">${item.desc}</textarea>
                    </td>
                    <td>
                        <input type="number" min="1" placeholder="1" value="${item.qty}"
                               oninput="updateItem(${index}, 'qty', this.value); renderItemsTable(); updatePreview(); validateForm();">
                    </td>
                    <td>
                        <input type="text" min="0" step="0.01" placeholder="0.00" value="${item.unit > 0 ? item.unit.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ''}"
                               oninput="formatNumberInput(this); updateItemFromFormattedInput(${index}, 'unit', this.value); updatePreview(); validateForm();">
                    </td>
                    <td class="total">${formatCurrency(item.total)}</td>
                    <td>
                        <button type="button" class="remove-item" onclick="removeItem(${index})" title="Eliminar fila">✕</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateItem(index, field, value) {
            const item = items[index];
            item[field] = field === 'qty' || field === 'unit' ? Number(value) || 0 : value;

            if (field === 'qty' || field === 'unit') {
                item.total = item.qty * item.unit;
                const rows = document.querySelectorAll('#itemsBody tr');
                if (rows[index]) {
                    const totalCell = rows[index].querySelector('.total');
                    if (totalCell) {
                        totalCell.textContent = formatCurrency(item.total);
                    }
                }
            }
        }

        function updateItemFromFormattedInput(index, field, formattedValue) {
            const item = items[index];
            const numericValue = parseFloat(formattedValue.replace(/,/g, '')) || 0;
            item[field] = numericValue;

            if (field === 'qty' || field === 'unit') {
                item.total = item.qty * item.unit;
                const rows = document.querySelectorAll('#itemsBody tr');
                if (rows[index]) {
                    const totalCell = rows[index].querySelector('.total');
                    if (totalCell) {
                        totalCell.textContent = formatCurrency(item.total);
                    }
                }
            }
        }

        function getValidItems() {
            return items.filter(item =>
                item.desc.trim() !== "" && item.qty > 0 && item.unit >= 0
            );
        }

        function getItemsForTotals() {
            return items.filter(item => item.qty > 0 && item.unit >= 0);
        }

        function clearForm() {
            document.getElementById('cliente').value = '';
            document.getElementById('direccion').value = '';
            document.getElementById('telefono').value = '';
            document.getElementById('cheque').value = '';
            document.getElementById('nit').value = '';
            document.getElementById('pago').value = '';
            document.getElementById('firmaEmpresa').value = 'Tec. Ing. Mario Roberto Gómez Martínez';
            document.getElementById('comentarios').value = '';
            document.getElementById('calcularIva').checked = true;

            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('fecha').value = `${year}-${month}-${day}`;

            items = [];
            addItemRow();
            updatePreview();
            validateForm();
        }

        function updatePreview() {
            const validItems = getValidItems();
            const itemsForTotals = getItemsForTotals();

            const cliente = document.getElementById('cliente').value;
            const direccion = document.getElementById('direccion').value;
            const telefono = document.getElementById('telefono').value;
            const fecha = document.getElementById('fecha').value;
            const cheque = document.getElementById('cheque').value;
            const nit = document.getElementById('nit').value;
            const pago = document.getElementById('pago').value;
            const firmaEmpresa = document.getElementById('firmaEmpresa').value;
            const comentarios = document.getElementById('comentarios').value;
            const folio = document.getElementById('folio').value;

            const fechaFormateada = fecha ?
                new Date(fecha + 'T00:00:00').toLocaleDateString("es-ES", {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }) : "";

            const subTotal = itemsForTotals.reduce((sum, item) => sum + item.total, 0);
            const calcularIva = document.getElementById('calcularIva').checked;
            const iva = calcularIva ? subTotal * 0.13 : 0;
            const total = subTotal + iva;

            const preview = document.getElementById('cotizacion-preview');
            preview.innerHTML = `
                <div class="watermark">
                    <img src="/favicon.jpg" alt="Watermark" style="width: 100%; height: 100%; object-fit: contain;">
                </div>

                <div class="pdf-header">
                    <div class="brand-section">
                        <div class="brand-name">MARIO ROBERTO GOMEZ</div>
                        <div class="brand-slogan">Solutions & Development</div>
                        <div class="brand-contact">
                            <span>Cel: 7756-3510</span> • <span>mrgomez.dev@gmail.com</span> • <span>El Salvador</span>
                        </div>
                    </div>
                    
                    <div class="meta-section">
                        <div class="doc-type">Cotización</div>
                        <div class="meta-item">No. Folio: <strong style="font-size: 10px;">${folio || 'S/N'}</strong></div>
                        <div class="meta-item">Fecha: <strong>${fechaFormateada}</strong></div>
                    </div>
                </div>

                <div class="client-section">
                    <div class="client-info">
                        <div class="section-title">Cliente</div>
                        <div style="font-size: 14px; font-weight: 700; color: var(--brand-primary);">${cliente || 'Cliente no especificado'}</div>
                        <div style="font-size: 12px; color: var(--text-dim); margin-top: 2px;">${direccion || ''}</div>
                        <div style="font-size: 11px; color: var(--text-dim);">Tel: ${telefono || 'N/A'}</div>
                    </div>
                    <div class="payment-info">
                        <div class="section-title">Condiciones</div>
                        <div style="font-size: 12px;">NIT: <strong>${nit || 'N/A'}</strong></div>
                        <div style="font-size: 12px;">Pago: <strong>${pago || 'Contado'}</strong></div>
                    </div>
                </div>

                <table class="pdf-table">
                    <thead>
                        <tr>
                            <th style="width: 58%;">Descripción</th>
                            <th style="width: 8%; text-align: center; white-space: nowrap;">Cant.</th>
                            <th style="width: 17%; text-align: right; white-space: nowrap;">Unitario</th>
                            <th style="width: 17%; text-align: right; white-space: nowrap;">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${validItems.length > 0 ? validItems.map(item => `
                            <tr>
                                <td>${(item.desc || '').replace(/\n/g, "<br>")}</td>
                                <td style="text-align: center; white-space: nowrap;">${item.qty || 0}</td>
                                <td style="text-align: right; white-space: nowrap;">${formatCurrency(item.unit || 0)}</td>
                                <td style="text-align: right; white-space: nowrap;">${formatCurrency(item.total || 0)}</td>
                            </tr>
                        `).join("") : '<tr><td colspan="4" style="text-align: center; color: var(--text-dim); padding: 40px;">No hay productos agregados a esta cotización.</td></tr>'}
                    </tbody>
                </table>

                <div class="totals-summary-area">
                    <div class="totals-box">
                        <div class="total-row">
                            <span>Subtotal</span>
                            <span>${formatCurrency(subTotal)}</span>
                        </div>
                        <div class="total-row">
                            <span>IVA ${calcularIva ? '(13%)' : '(No aplica)'}</span>
                            <span>${formatCurrency(iva)}</span>
                        </div>
                        <div class="total-row grand-total">
                            <span>Total USD</span>
                            <span>${formatCurrency(total)}</span>
                        </div>
                    </div>
                </div>

                <div class="comments-box">
                    <div class="section-title">Notas y observaciones</div>
                    <div>${comentarios ? comentarios.replace(/\n/g, "<br>") : 'Esta cotización tiene una validez de 30 días calendario.'}</div>
                    <div style="margin-top: 16px; font-size: 10px; font-style: italic;">Cheque a nombre de: ${cheque || 'Mario Roberto Gomez Martinez'}</div>
                </div>

                <div class="signature-section">
                    <div class="signature-box">
                        <div class="signature-line"></div>
                        <div class="signature-name">Aceptado por</div>
                        <div class="signature-title">Firma del Cliente</div>
                    </div>
                    <div class="signature-box">
                        <div class="signature-line"></div>
                        <div class="signature-name">${firmaEmpresa || 'Tec. Ing. Mario Roberto Gómez Martínez'}</div>
                        <div class="signature-title">Consultor de Desarrollo</div>
                    </div>
                </div>
            `;
        }

        function downloadPDFAlternative() {
            const preview = document.getElementById('cotizacion-preview');
            updatePreview();

            window.scrollTo(0, 0);

            const originalMargin = preview.style.margin;
            preview.style.margin = '0';

            const widthPx = preview.offsetWidth || 794;
            const heightPx = preview.offsetHeight;

            const widthPt = widthPx * 0.75;
            const heightPt = (heightPx * 0.75) - 2;

            let folioTexto = document.getElementById('folio').value || 'Generica';
            if (folioTexto.length > 15) folioTexto = folioTexto.substring(0, 8);

            const opt = {
                margin: 10,
                filename: `Cotizacion_${folioTexto}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                pagebreak: { mode: 'avoid-all' },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    logging: false,
                    scrollX: 0,
                    scrollY: 0
                },
                jsPDF: {
                    unit: 'mm',
                    format: 'letter',
                    orientation: 'portrait'
                }
            };

            html2pdf().set(opt).from(preview).save().then(() => {
                console.log('PDF generado exitosamente.');
                preview.style.margin = originalMargin;
            }).catch(err => {
                console.error('Error al generar PDF con html2pdf, lanzando diálogo de impresión:', err);
                preview.style.margin = originalMargin;
                window.print();
            });
        }

        function downloadCotizacion() {
            validateForm();

            const downloadButton = document.getElementById('downloadButton');
            if (downloadButton.disabled) {
                alert('Por favor complete todos los campos requeridos antes de descargar la cotización.');
                return;
            }

            downloadPDFAlternative();
        }
    </script>
</body>

</html>
